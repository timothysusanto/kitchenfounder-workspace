name: creator-engine tests
on:
  push:
    paths: ['creator-engine/**', '.github/workflows/creator-engine.yml']
  pull_request:
    paths: ['creator-engine/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: creator-engine/package-lock.json
      - run: npm ci
      - run: npm test
