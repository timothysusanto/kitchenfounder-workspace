<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:800px;height:800px;overflow:hidden;background:#0a0a0a;}
.wrap{width:800px;height:800px;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);}
.mark{position:relative;z-index:2;text-align:center;}
.bracket-row{display:flex;align-items:center;justify-content:center;}
.bracket{color:rgba(255,255,255,0.15);font-size:280px;font-family:'Arial',sans-serif;font-weight:100;line-height:1;margin:0 -10px;}
.letters{display:flex;flex-direction:column;align-items:center;}
.k{color:#ffffff;font-size:200px;font-weight:900;font-family:'Arial Black',sans-serif;line-height:0.85;letter-spacing:-6px;}
.f{color:#ffffff;font-size:200px;font-weight:900;font-family:'Arial Black',sans-serif;line-height:0.85;letter-spacing:-6px;}
.label{position:absolute;bottom:60px;left:0;right:0;text-align:center;z-index:2;}
.label-text{color:rgba(255,255,255,0.25);font-size:22px;font-family:'Courier New',monospace;letter-spacing:10px;text-transform:uppercase;}
.dot{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#fff;opacity:0.4;z-index:2;}
.corner{position:absolute;width:30px;height:30px;z-index:2;opacity:0.2;}
.tl{top:40px;left:40px;border-top:2px solid #fff;border-left:2px solid #fff;}
.tr{top:40px;right:40px;border-top:2px solid #fff;border-right:2px solid #fff;}
.bl{bottom:40px;left:40px;border-bottom:2px solid #fff;border-left:2px solid #fff;}
.br{bottom:40px;right:40px;border-bottom:2px solid #fff;border-right:2px solid #fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="dot"></div>
  <div class="mark">
    <div class="bracket-row">
      <div class="bracket">[</div>
      <div class="letters">
        <div class="k">K</div>
        <div class="f">F</div>
      </div>
      <div class="bracket">]</div>
    </div>
  </div>
  <div class="label">
    <div class="label-text">Kitchen Founder</div>
  </div>
</div>
</body>
</html>
