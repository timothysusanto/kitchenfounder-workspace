<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>Sri Lankan Hoppers Bar — Complete Operations Guide</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background-color: #FAFAF8;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .cover {
      width: 1200px;
      height: 1200px;
      background-color: #FAFAF8;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ── Top flag bar ── */
    .flag-bar-top {
      width: 100%;
      height: 10px;
      display: flex;
      flex-shrink: 0;
    }
    .flag-bar-top .stripe-left   { flex: 1; background-color: #8D153A; }
    .flag-bar-top .stripe-centre { flex: 1; background-color: #FC4C02; }
    .flag-bar-top .stripe-right  { flex: 1; background-color: #00534C; }

    /* ── Main content area ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 100px 50px;
      width: 100%;
      text-align: center;
    }

    /* ── Eyebrow ── */
    .eyebrow {
      font-family: 'Helvetica Neue', 'Arial', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #E85D26;
      margin-bottom: 36px;
    }

    /* ── Title ── */
    .title-block {
      margin-bottom: 32px;
    }
    .title-line {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 92px;
      font-weight: 700;
      color: #1C1C1C;
      line-height: 1.0;
      letter-spacing: -0.02em;
      display: block;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-family: 'Helvetica Neue', 'Arial', sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: #555555;
      letter-spacing: 0.04em;
      margin-bottom: 44px;
    }

    /* ── Decorative rule ── */
    .hr-accent {
      width: 120px;
      height: 2px;
      background-color: #E85D26;
      border: none;
      margin-bottom: 44px;
      flex-shrink: 0;
    }

    /* ── Hopper bowl (CSS hemispherical arc) ── */
    .hopper-bowl {
      width: 80px;
      height: 44px;
      border: 3px solid #E85D26;
      border-top: none;
      border-radius: 0 0 50px 50px;
      position: relative;
      margin-bottom: 44px;
      flex-shrink: 0;
    }
    .hopper-bowl::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 3px;
      background-color: #E85D26;
      border-radius: 2px;
    }

    /* ── Feature badges ── */
    .badges {
      display: flex;
      gap: 16px;
      margin-bottom: 54px;
      flex-wrap: nowrap;
    }
    .badge {
      font-family: 'Helvetica Neue', 'Arial', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #1C1C1C;
      background-color: transparent;
      border: 1.5px solid #C8C4BE;
      border-radius: 999px;
      padding: 10px 22px;
      white-space: nowrap;
    }

    /* ── Price + domain ── */
    .bottom-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .price {
      font-family: 'Helvetica Neue', 'Arial', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #E85D26;
      letter-spacing: 0.02em;
    }
    .domain {
      font-family: 'Helvetica Neue', 'Arial', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #999999;
    }

    /* ── Bottom flag bar ── */
    .flag-bar-bottom {
      width: 100%;
      height: 10px;
      display: flex;
      flex-shrink: 0;
    }
    .flag-bar-bottom .stripe-left   { flex: 1; background-color: #8D153A; }
    .flag-bar-bottom .stripe-centre { flex: 1; background-color: #FC4C02; }
    .flag-bar-bottom .stripe-right  { flex: 1; background-color: #00534C; }

    /* ── Inner editorial frame ── */
    .inner-frame {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      bottom: 24px;
      border: 1px solid rgba(28, 28, 28, 0.08);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="cover">

    <!-- Top flag bar -->
    <div class="flag-bar-top">
      <div class="stripe-left"></div>
      <div class="stripe-centre"></div>
      <div class="stripe-right"></div>
    </div>

    <!-- Main content -->
    <div class="content">

      <p class="eyebrow">KitchenFounder&nbsp;&nbsp;·&nbsp;&nbsp;Operations Guide v7&nbsp;&nbsp;·&nbsp;&nbsp;US Market 2025</p>

      <div class="title-block">
        <span class="title-line">SRI LANKAN</span>
        <span class="title-line">HOPPERS BAR</span>
      </div>

      <p class="subtitle">Complete Restaurant Operations Guide</p>

      <hr class="hr-accent">

      <!-- Hopper bowl: CSS-drawn hemispherical bowl -->
      <div class="hopper-bowl"></div>

      <!-- Feature badges -->
      <div class="badges">
        <span class="badge">20 Recipes</span>
        <span class="badge">Arrack Cocktails</span>
        <span class="badge">Kitchen Design</span>
        <span class="badge">P&amp;L Model</span>
      </div>

      <!-- Price + domain -->
      <div class="bottom-info">
        <span class="price">$29.99</span>
        <span class="domain">kitchenfounder.com</span>
      </div>

    </div>

    <!-- Bottom flag bar -->
    <div class="flag-bar-bottom">
      <div class="stripe-left"></div>
      <div class="stripe-centre"></div>
      <div class="stripe-right"></div>
    </div>

    <!-- Inner editorial frame -->
    <div class="inner-frame"></div>

  </div>
</body>
</html>
