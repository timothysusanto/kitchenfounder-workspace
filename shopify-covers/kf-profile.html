<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:800px;height:800px;overflow:hidden;background:#060810;}
.wrap{width:800px;height:800px;background:linear-gradient(145deg,#060810 0%,#0a0f1a 50%,#060810 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}

/* Blue glow centre */
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(0,120,255,0.12) 0%,rgba(0,60,180,0.06) 40%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;}
.glow2{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(80,160,255,0.08) 0%,transparent 70%);top:42%;left:48%;transform:translate(-50%,-50%);z-index:1;}

/* Dot grid */
.grid{position:absolute;inset:0;z-index:0;}
.grid-dot{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(80,140,255,0.2);}

/* Main SVG */
.main{position:relative;z-index:3;text-align:center;}
.logo-svg{width:440px;height:440px;}

/* Label */
.label{position:absolute;bottom:52px;left:0;right:0;text-align:center;z-index:3;}
.label-top{color:rgba(80,140,255,0.35);font-size:17px;font-family:'Courier New',monospace;letter-spacing:12px;text-transform:uppercase;margin-bottom:6px;}
.label-main{color:rgba(255,255,255,0.6);font-size:26px;font-family:'Arial',sans-serif;font-weight:700;letter-spacing:8px;text-transform:uppercase;}

/* Scanlines */
.scanline{position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,80,255,0.018) 3px,rgba(0,80,255,0.018) 4px);z-index:4;pointer-events:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="main">
    <svg class="logo-svg" viewBox="0 0 440 440" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Outer rings -->
      <circle cx="220" cy="220" r="208" stroke="rgba(0,100,255,0.12)" stroke-width="1"/>
      <circle cx="220" cy="220" r="192" stroke="rgba(0,100,255,0.07)" stroke-width="1"/>

      <!-- ==== K LETTERFORM — CLEAN & CLEAR ==== -->
      <!-- K vertical bar — bright white, chunky -->
      <rect x="88" y="110" width="36" height="220" fill="white"/>

      <!-- K upper arm — thick, sharp, clean diagonal
           This IS the knife blade — same angle every time -->
      <!-- Upper arm as a clean parallelogram -->
      <polygon points="124,110 310,110 310,148 160,220" fill="white"/>

      <!-- K lower arm — clean mirror -->
      <polygon points="160,220 310,292 310,330 124,330" fill="white"/>

      <!-- Blue accent: knife blade edge highlight on upper arm -->
      <line x1="124" y1="110" x2="310" y2="110" stroke="#4A9EFF" stroke-width="3" opacity="0.9"/>
      <line x1="124" y1="110" x2="160" y2="220" stroke="#4A9EFF" stroke-width="2" opacity="0.5"/>

      <!-- ==== F LETTERFORM ==== -->
      <!-- F vertical — the knife handle -->
      <rect x="236" y="110" width="34" height="220" fill="white"/>
      <!-- F top bar -->
      <rect x="236" y="110" width="116" height="34" fill="white"/>
      <!-- F mid bar -->
      <rect x="236" y="203" width="90" height="30" fill="white"/>

      <!-- Handle rivets — subtle, only see on close look -->
      <circle cx="253" cy="272" r="5" fill="#060810" opacity="0.9"/>
      <circle cx="253" cy="296" r="5" fill="#060810" opacity="0.9"/>

      <!-- ==== THE GLINT — knife tip, top right ==== -->
      <!-- This is the "aha" trigger — makes the eye go back to trace the blade -->
      <circle cx="310" cy="110" r="6" fill="#4A9EFF"/>
      <circle cx="310" cy="110" r="12" fill="rgba(74,158,255,0.25)"/>
      <circle cx="310" cy="110" r="20" fill="rgba(74,158,255,0.1)"/>

      <!-- Blue reflection line along the full blade length -->
      <line x1="124" y1="112" x2="310" y2="112" stroke="#4A9EFF" stroke-width="1.5" opacity="0.4"/>

      <!-- Corner scan marks -->
      <line x1="50" y1="50" x2="80" y2="50" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>
      <line x1="50" y1="50" x2="50" y2="80" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>
      <line x1="390" y1="50" x2="360" y2="50" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>
      <line x1="390" y1="50" x2="390" y2="80" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>
      <line x1="50" y1="390" x2="80" y2="390" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>
      <line x1="50" y1="390" x2="50" y2="360" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>
      <line x1="390" y1="390" x2="360" y2="390" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>
      <line x1="390" y1="390" x2="390" y2="360" stroke="rgba(74,158,255,0.3)" stroke-width="1.5"/>

      <!-- Subtle lens flare dot bottom right -->
      <circle cx="355" cy="330" r="3" fill="rgba(74,158,255,0.3)"/>
      <circle cx="355" cy="330" r="7" fill="rgba(74,158,255,0.1)"/>

    </svg>
  </div>

  <div class="label">
    <div class="label-top">est. 2025</div>
    <div class="label-main">Kitchen Founder</div>
  </div>

  <div class="scanline"></div>
</div>

<script>
const grid = document.getElementById('grid');
for(let row = 0; row < 20; row++){
  for(let col = 0; col < 20; col++){
    const dot = document.createElement('div');
    dot.className = 'grid-dot';
    dot.style.top = (row * 42 + 10) + 'px';
    dot.style.left = (col * 42 + 10) + 'px';
    dot.style.opacity = (Math.random() * 0.12 + 0.04).toFixed(2);
    grid.appendChild(dot);
  }
}
</script>
</body>
</html>
